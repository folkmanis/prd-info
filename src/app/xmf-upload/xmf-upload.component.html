<mat-card appFileDrop (filesEmitter)="onFileDropped($event)">
  <mat-card-header>
    <mat-card-title> Arhīva fails </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div>Nomest šeit!</div>
    <div>
      @if (file(); as file) {
        <span> {{ file.name }} // {{ file.size | filesize }} </span>
      }
    </div>
  </mat-card-content>

  <mat-card-actions>
    <button matButton (click)="fileInput.click()" [disabled]="busy()">Atvērt</button>
    <input hidden (change)="onFileSelected($event)" #fileInput type="file" accept=".dbd" />
    <button matButton="elevated" (click)="onUpload()" [disabled]="file() === null || busy()">Apstrādāt!</button>
  </mat-card-actions>

  <mat-card-footer>
    <mat-progress-bar [mode]="busy() ? 'indeterminate' : 'determinate'" />
  </mat-card-footer>
</mat-card>

@if (history.hasValue()) {
  <app-tabula [history]="history.value()" scroll-to-top />
}
